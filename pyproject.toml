[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "j-ai-platform"
version = "1.1.1"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9"]

[project.scripts]
j-platform = "j_platform.app:main"

[tool.setuptools.packages.find]
include = ["j_platform*"]
